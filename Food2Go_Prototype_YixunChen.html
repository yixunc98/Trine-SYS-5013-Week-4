<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food2Go | Find Something Good</title><style>
:root{--ink:#18283b;--muted:#657387;--brand:#7954c7;--bg:#f6f4fc;--line:#e4e7ed;--green:#167653}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1040px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:26px;font-weight:900;color:var(--brand)}.sub{color:var(--muted)}.pill{border-radius:20px;background:#fff;padding:8px 12px;font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.nav button{border:1px solid var(--line);border-radius:999px;background:white;padding:9px 17px;color:var(--ink)}.nav button.active{background:var(--ink);color:white}.heading{font-size:26px;font-weight:800;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.pad{padding:18px}.cover{height:126px;display:grid;place-items:center;font-size:62px;background:linear-gradient(125deg,#f0e8ff,#d9f4ec)}.tag{font-size:12px;color:var(--green);font-weight:700}.price{font-weight:800}.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{background:#edf0f5;color:var(--ink)}.btn.small{padding:7px 11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu .card{padding:15px}.field{display:block;margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd5df;border-radius:9px;padding:10px;background:white}.field textarea{min-height:85px}.notice{background:#fff7e9;border:1px solid #f4d8aa;border-radius:12px;padding:12px;margin:14px 0}.success{background:#e9f8ef;border-color:#afdfbf}.progress{display:flex;gap:6px;margin:24px 0}.step{height:10px;border-radius:50px;flex:1;background:#dfe4ea}.step.done{background:#1e9e72}.muted{color:var(--muted)}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.empty{padding:36px;background:white;border-radius:14px;text-align:center}.sidebar{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.total{font-size:23px;font-weight:850}.footer{margin-top:30px;font-size:12px;color:var(--muted);text-align:center}.stars{display:flex;gap:7px}.stars button{font-size:29px;border:0;background:transparent;color:#b7bfca}.stars button.chosen{color:#efa522}.moodbar{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin:14px 0 20px}.moodactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.moodactions button{border:1px solid #d7d0e8;border-radius:999px;background:#f7f2ff;color:#3c3261;padding:8px 13px;font-size:13px}.moodactions button.selected{background:#6749ad;color:#fff}.moodinfo{font-size:13px;color:var(--muted);margin:8px 0 0}.hide{display:none!important}@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.sidebar{grid-template-columns:1fr}}@media(max-width:520px){.grid,.menu{grid-template-columns:1fr}.shell{padding:12px}.top{align-items:start}.heading{font-size:23px}}
</style></head><body><main class="shell"><div class="top"><div><div class="logo">🍱 Food2Go </div><div class="sub">Good food, whatever you’re in the mood for.</div></div><div class="pill">Try the demo · No real orders or payments</div></div><div class="nav" id="nav"></div><div id="app" aria-live="polite"></div><div class="footer">Food2Go is a class project, not a real delivery service. Your cart, test orders, and reviews stay in this browser.</div></main>
<script>
const restaurants=[{id:'r1',name:'Urban Bowl',category:'Healthy',eta:'20–30 min',emoji:'🥗',rating:'4.8',foods:[{id:'f1',name:'Chicken Power Bowl',price:13.5,desc:'Rice, grilled chicken, fresh vegetables'},{id:'f2',name:'Tofu Green Bowl',price:12,desc:'Tofu, avocado, greens'}]},{id:'r2',name:'Trattoria Bella',category:'Italian',eta:'25–35 min',emoji:'🍝',rating:'4.7',foods:[{id:'f3',name:'Margherita Pizza',price:15,desc:'Tomato, mozzarella, basil'},{id:'f4',name:'Creamy Pesto Pasta',price:17,desc:'Pasta with basil pesto and parmesan'}]},{id:'r3',name:'Taco Fiesta',category:'Mexican',eta:'15–25 min',emoji:'🌮',rating:'4.9',foods:[{id:'f5',name:'Chicken Tacos',price:14,desc:'Three tacos with chicken, salsa, and lime'},{id:'f6',name:'Cheese Quesadilla',price:9,desc:'Grilled tortilla with cheese and peppers'}]}];
const $=s=>document.querySelector(s);const money=x=>'$'+x.toFixed(2);const save=()=>localStorage.setItem('food2go_demo_v3',JSON.stringify(state));const initial={page:'browse',restaurant:null,cart:[],orders:[],feedback:[],filter:'All',mood:'Any',search:'',form:{name:'',address:'',method:'Card (demo)'},rating:0};let state={...initial,...JSON.parse(localStorage.getItem('food2go_demo_v3')||'{}')};let notice='';const findFood=id=>restaurants.flatMap(r=>r.foods.map(f=>({...f,restaurant:r.name,restaurantId:r.id}))).find(f=>f.id===id);const subtotal=()=>state.cart.reduce((s,x)=>s+findFood(x.id).price*x.qty,0);const fee=()=>state.cart.length?2.99:0;const total=()=>subtotal()+fee();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page,id){state.page=page;if(id)state.restaurant=id;notice='';save();render()}function nav(){let tabs=[['browse','Find food'],['cart','Cart ('+state.cart.reduce((s,x)=>s+x.qty,0)+')'],['orders','My orders'],['feedback','Reviews']];$('#nav').innerHTML=tabs.map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}
function render(){nav();let html='';if(notice)html+=`<div class="notice">${esc(notice)}</div>`;if(state.page==='browse'){html+=`<h1 class="heading">What sounds good today?</h1><div class="moodbar"><strong>✨ Not sure what to eat?</strong><p class="moodinfo">Pick what you’re in the mood for, and we’ll show you a few dishes to try.</p><div class="moodactions" id="moods"></div></div><div class="field"><label for="search">Search for a restaurant or dish</label><input id="search" placeholder="Pizza, tacos, pasta…" value="${esc(state.search)}" oninput="state.search=this.value;save();drawResults()"></div><div class="nav" style="margin:12px 0" id="filters"></div><div class="grid" id="results"></div>`}else if(state.page==='menu'){const r=restaurants.find(x=>x.id===state.restaurant);html+=`<button class="btn secondary small" onclick="go('browse')">← Back to restaurants</button><h1 class="heading">${esc(r.name)}</h1><p class="sub">${esc(r.category)} · ★ ${r.rating} · ${r.eta}</p><div class="menu">${r.foods.map(f=>`<div class="card"><div class="pad"><div class="row"><strong>${esc(f.name)}</strong><span class="price">${money(f.price)}</span></div><p class="muted">${esc(f.desc)}</p><span class="tag">${moodLabel(f.id)}</span><br><br><button class="btn small" onclick="add('${f.id}')">Add to cart</button></div></div>`).join('')}</div>`}else if(state.page==='cart'){html+=`<h1 class="heading">Your cart</h1>`;if(!state.cart.length){html+='<div class="empty">Nothing in your cart yet. <p>Found something tasty? Add it here to get started.</p><button class="btn" onclick="go(\'browse\')">Find restaurants</button></div>'}else{html+='<div class="sidebar"><section class="card pad">';html+=state.cart.map(x=>{let f=findFood(x.id);return `<div class="row listrow"><div><strong>${esc(f.name)}</strong><div class="muted">${esc(f.restaurant)} · ${money(f.price)} each</div></div><div><button class="btn secondary small" aria-label="Remove one ${esc(f.name)}" onclick="qty('${x.id}',-1)">−</button> ${x.qty} <button class="btn secondary small" aria-label="Add one ${esc(f.name)}" onclick="qty('${x.id}',1)">+</button></div></div>`}).join('');html+=`</section><aside class="card pad"><h3>Order summary</h3><div class="row"><span>Subtotal</span>${money(subtotal())}</div><div class="row"><span>Demo delivery fee</span>${money(fee())}</div><hr><div class="row total"><span>Total</span>${money(total())}</div><br><button class="btn" style="width:100%" onclick="go('checkout')">Go to checkout</button></aside></div>`}}else if(state.page==='checkout'){if(!state.cart.length){state.page='cart';render();return}html+=`<h1 class="heading">Almost there!</h1><div class="sidebar"><section class="card pad"><div class="field"><label for="cname">Name for the order</label><input id="cname" value="${esc(state.form.name)}"></div><div class="field"><label for="caddress">Where should it go?</label><input id="caddress" placeholder="123 Main St" value="${esc(state.form.address)}"></div><div class="field"><label for="cmethod">How would you pay?</label><select id="cmethod"><option>Card (demo)</option><option>Cash (demo)</option></select></div><div class="notice">Just a practice order—no payment will be taken, and nothing will be delivered.</div><button class="btn" onclick="place()">Place test order · ${money(total())}</button></section><aside class="card pad"><h3>Order summary</h3>${state.cart.map(x=>`<div class="row"><span>${esc(findFood(x.id).name)} ×${x.qty}</span><span>${money(findFood(x.id).price*x.qty)}</span></div>`).join('')}<hr><div class="row total"><span>Total</span><span>${money(total())}</span></div></aside></div>`}else if(state.page==='orders'){html+='<h1 class="heading">Your orders</h1>';if(!state.orders.length)html+='<div class="empty">No orders to show yet. Try placing a test order to see how tracking works.</div>';else html+=state.orders.map(o=>{let labels=['Placed','Preparing','Out for delivery','Delivered'];return `<div class="card pad" style="margin-bottom:16px"><div class="row"><strong>Order #${o.id}</strong><span class="tag">${labels[o.status]}</span></div><div class="muted">${esc(o.name)} · ${esc(o.address)} · ${money(o.total)}</div><div class="progress">${labels.map((_,i)=>`<div class="step ${i<=o.status?'done':''}"></div>`).join('')}</div><p><strong>Status:</strong> ${labels[o.status]}</p><div class="row"><button class="btn secondary small" onclick="advance('${o.id}')" ${o.status>=3?'disabled':''}>${o.status>=3?'Delivered':'Show next step →'}</button>${o.status===3?`<button class="btn small" onclick="go('feedback')">Write a review</button>`:''}</div><p class="muted" style="font-size:12px">This is a sample tracking timeline. Use the button to move to the next step.</p></div>`}).join('')}else if(state.page==='feedback'){html+=`<h1 class="heading">Tell us what you think</h1><div class="card pad"><p>How did the ordering experience feel?</p><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=state.rating?'chosen':''}" aria-label="${n} stars" onclick="state.rating=${n};render()">★</button>`).join('')}</div><div class="field"><label for="review">Your review</label><textarea id="review" placeholder="What did you like? Anything you’d change?"></textarea></div><button class="btn" onclick="submitFeedback()">Post review</button></div><h3>Recent reviews</h3>${state.feedback.length?state.feedback.map(f=>`<div class="card pad" style="margin-bottom:10px"><span style="color:#d79918">${'★'.repeat(f.rating)}</span><p>${esc(f.text)}</p></div>`).join(''):'<p class="muted">No reviews yet. Be the first to share one.</p>'}`}$('#app').innerHTML=html;if(state.page==='browse')drawResults()}
const moodTags={f1:'Fresh',f2:'Fresh',f3:'Comfort',f4:'Comfort',f5:'Cozy',f6:'Cozy'};const moodLabel=id=>({Fresh:'🥗 Something fresh',Comfort:'🍕 Something comforting',Cozy:'🌮 Something cozy'})[moodTags[id]];function setMood(m){state.mood=m;save();drawResults()}function surprise(){let matches=restaurants.flatMap(r=>r.foods.filter(f=>state.mood==='Any'||moodTags[f.id]===state.mood).map(f=>({r,f})));let pick=matches[Math.floor(Math.random()*matches.length)];if(pick){state.restaurant=pick.r.id;state.page='menu';notice='✨ How about '+pick.f.name+' from '+pick.r.name+'?';save();render()}}function drawResults(){let moodList=['Any','Fresh','Cozy','Comfort'];$('#moods').innerHTML=moodList.map(m=>`<button class="${state.mood===m?'selected':''}" onclick="setMood('${m}')">${({Any:'✨ Anything goes',Fresh:'🥗 Fresh',Cozy:'🌮 Cozy',Comfort:'🍕 Comfort'})[m]}</button>`).join('')+`<button onclick="surprise()" style="border-style:dashed">🎲 Pick for me</button>`;let fs=['All','Healthy','Italian','Mexican'];$('#filters').innerHTML=fs.map(x=>`<button class="${state.filter===x?'active':''}" onclick="state.filter='${x}';save();drawResults()">${x}</button>`).join('');let q=state.search.toLowerCase().trim();let a=restaurants.filter(r=>(state.filter==='All'||r.category===state.filter)&&(state.mood==='Any'||r.foods.some(f=>moodTags[f.id]===state.mood))&&(!q||r.name.toLowerCase().includes(q)||r.category.toLowerCase().includes(q)||r.foods.some(f=>f.name.toLowerCase().includes(q))));$('#results').innerHTML=a.map(r=>`<div class="card"><div class="cover">${r.emoji}</div><div class="pad"><div class="row"><strong>${esc(r.name)}</strong><span>★ ${r.rating}</span></div><p class="muted">${esc(r.category)} · ${esc(r.eta)}</p><p class="tag">${r.foods.filter(f=>state.mood==='Any'||moodTags[f.id]===state.mood).map(f=>moodLabel(f.id)).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')}</p><button class="btn small" onclick="go('menu','${r.id}')">View menu →</button></div></div>`).join('')||'<div class="empty">No matches this time. Try another search or change the filters.</div>'}
function add(id){let f=findFood(id);if(state.cart.length&&findFood(state.cart[0].id).restaurantId!==f.restaurantId){if(!confirm('Want to order from this restaurant instead? We’ll clear the items in your current cart.'))return;state.cart=[]}let item=state.cart.find(x=>x.id===id);item?item.qty++:state.cart.push({id,qty:1});notice=f.name+' added to your cart.';save();render()}function qty(id,n){let x=state.cart.find(x=>x.id===id);if(x){x.qty+=n;if(x.qty<=0)state.cart=state.cart.filter(y=>y!==x)}save();render()}function place(){let name=$('#cname').value.trim(),addr=$('#caddress').value.trim();if(!name||!addr){notice='Add your name and delivery address to continue.';render();return}state.form={name,address:addr,method:$('#cmethod').value};state.orders.unshift({id:String(Date.now()).slice(-6),name,address:addr,total:total(),status:0,items:structuredClone(state.cart)});state.cart=[];state.page='orders';notice='Your test order is in! Use “Show next step” to try the tracking feature.';save();render()}function advance(id){let o=state.orders.find(x=>x.id===id);if(o&&o.status<3)o.status++;save();render()}function submitFeedback(){let text=$('#review').value.trim();if(!state.rating||!text){notice='Choose a star rating and add a few words before posting.';render();return}state.feedback.unshift({rating:state.rating,text});state.rating=0;notice='Thanks for sharing! Your review has been saved in this browser.';save();render()}render();
</script></body></html>
